  function ownerDebtAuditHtml(driverId, driver) {
    const details = Array.isArray(driver.oldDebtDetails) ? driver.oldDebtDetails : [];
    const legacy = Number(driver.oldDebts || 0);
    const paymentParts = p => {
      if (String(p.status || '').toLowerCase() === 'voided') return [];
      if (Array.isArray(p.allocations) && p.allocations.length) return p.allocations.map(a => ({...a, amount:Number(a.amount ?? a.allocationAmount ?? 0)}));
      if (p.allocationKind || p.obligationId || p.contractId) return [{allocationKind:p.allocationKind, obligationId:p.obligationId, contractId:p.contractId, amount:Number(p.allocationAmount ?? p.amount ?? 0)}];
      return [{allocationKind:null, amount:Number(p.amount || 0), legacy:true}];
    };
    const pays = gPayments.filter(p => p.driverId === driverId && paymentParts(p).length);
    const unallocated = pays.filter(p => paymentParts(p).some(a => !a.allocationKind && ['أجرة يومية','أجرة شهرية','دين قديم'].includes(p.type)));
    let html = `<div class="card"><h3>🧾 سجل الدين المرتبط بالعقد</h3>`;
    if (unallocated.length) html += `<div class="alert yellow"><div class="icon">⚠️</div><div class="body"><div class="title">دفعات تحتاج مراجعة (${unallocated.length})</div><div class="desc">هذه الدفعات قديمة أو بلا تخصيص صريح، ولا يعاد توزيعها تلقائياً.</div></div></div>`;
    if (!details.length && legacy) html += `<div class="audit-summary"><strong>⚠️ دين قديم بلا مصدر عقد</strong><div class="small-muted">المبلغ: ${fmtKD(legacy)} · يحتاج ربطاً بعقد أو مستند مصدر</div></div>`;
    html += details.map((o, i) => {
      const id = o.id || `legacy-debt-${driverId}-${i + 1}`;
      const settled = pays.filter(p => paymentParts(p).some(a => a.allocationKind === 'oldDebt' && a.obligationId === id));
      const original = Number(o.originalAmount ?? o.amount ?? 0);
      const remaining = Math.max(0, original - settled.reduce((s,p)=>s + paymentParts(p).filter(a=>a.allocationKind==='oldDebt' && a.obligationId===id).reduce((x,a)=>x+Number(a.amount||0),0),0));
      return `<details class="audit-summary" open><summary><strong>${o.contractLabel || 'دين عقد سابق'}</strong> · المتبقي ${fmtKD(remaining)}</summary>
        <div class="audit-summary-grid">
          <div>رقم العقد<b style="font-size:13px">${o.contractId || 'غير مربوط ⚠️'}</b></div>
          <div>الفترة<b style="font-size:13px">${o.contractStart ? fmtDate(o.contractStart) : '—'} – ${o.contractEnd ? fmtDate(o.contractEnd) : '—'}</b></div>
          <div>الاستحقاق<b>${fmtKD(o.expectedRent)}</b></div>
          <div>مدفوع أثناء العقد<b>${fmtKD(o.paidDuringContract)}</b></div>
          <div>المرحّل<b>${fmtKD(original)}</b></div>
          <div>الحالة<b style="font-size:13px">${o.status || (remaining ? 'مفتوح' : 'مسدد')}</b></div>
        </div>
        <div class="small-muted" style="margin-top:8px;">تسويات لاحقة: ${settled.length} · أنشئ بواسطة: ${o.createdBy || 'غير مسجل'}${o.note ? ' · '+o.note : ''}</div>

    }).join('');

  /* ================= OWNER NOTES (سرية - مالك فقط) ================= */
  function escapeHtml(s) {
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function noteTypeMeta(t) {
    const m = {
      'عذر':    {icon:'🙏', color:'#58a6ff'},
      'اتفاق':  {icon:'🤝', color:'#3fb950'},
      'تحذير':  {icon:'⚠️', color:'#f85149'},
      'تذكير':  {icon:'⏰', color:'#d29922'},
      'ملاحظة': {icon:'📝', color:'#8b949e'}
    };
    return m[t] || m['ملاحظة'];
  }
  function renderOwnerNotesList(items) {
    const box = document.getElementById('ownerNotesList');
    if (!box) return;
    if (!items.length) { box.innerHTML = '<p class="small-muted">📝 ما عندك ملاحظات لهذا السائق — اكتب أول ملاحظة فوق.</p>'; return; }
    const sorted = items.slice().sort((a,b) => (toDate(b.at)||0) - (toDate(a.at)||0));
    box.innerHTML = sorted.map(n => {
      const meta = noteTypeMeta(n.type);
      const dt = toDate(n.at);
      const when = dt ? dt.toLocaleString('ar-KW') : '—';
      return '<div class="owner-note-item" style="--note-color:'+meta.color+';">'
        + '<div class="owner-note-head">'
        + '<span class="owner-note-type">'+meta.icon+' '+escapeHtml(n.type||'ملاحظة')+'</span>'
        + '<span class="owner-note-meta">🕒 '+when+'</span>'
        + '</div>'
        + '<div class="owner-note-text">'+escapeHtml(n.text)+'</div>'
        + (n.by ? '<div class="owner-note-meta" style="margin-top:7px;">— '+escapeHtml(n.by)+'</div>' : '')
        + '</div>';
    }).join('');
  }
  async function loadOwnerNotes(driverId) {
    const box = document.getElementById('ownerNotesList');
    if (box) box.innerHTML = '<p class="small-muted">جاري التحميل...</p>';
    try {
      const doc = await firebase.firestore().collection('ownerNotes').doc(driverId).get();
      if (!gModalDriver || gModalDriver.id !== driverId) return;
      const items = [];
      if (doc.exists) {
        const d = doc.data();
        if (Array.isArray(d.entries)) d.entries.forEach(e => items.push(e));
        // ملاحظة قديمة (نظام سابق) تظهر كأقدم ملاحظة بالسجل عشان ما تضيع
        if (d.note && String(d.note).trim() && !(Array.isArray(d.entries) && d.entries.some(e => e.text === d.note))) {
          items.push({ text: d.note, type: 'ملاحظة', at: d.updatedAt || null, by: d.updatedBy || '' });
        }
      }
      renderOwnerNotesList(items);
    } catch(e) {
      console.error('loadOwnerNotes err:', e);
      if (box) box.innerHTML = '<p style="color:#f85149;font-size:12px;">⚠️ تعذّر تحميل الملاحظات: ' + escapeHtml(e.message||e) + '</p>';
    }
  }
  async function addOwnerNote() {
    if (!gModalDriver) return;
    const noteDriver = gModalDriver;
    const txt = document.getElementById('ownerNoteText');
    const typeSel = document.getElementById('ownerNoteType');
    const btn = document.getElementById('ownerNoteAddBtn');
    const status = document.getElementById('ownerNoteStatus');
    if (btn.disabled) return;
    const text = (txt.value||'').trim();
    if (!text) { status.innerHTML = '<span style="color:#d29922;">اكتب نص الملاحظة أول</span>'; return; }
    const entry = {
      text: text,
      type: (typeSel && typeSel.value) || 'ملاحظة',
      at: new Date().toISOString(),
      by: gAuthUser ? gAuthUser.email : 'owner'
    };
    btn.disabled = true; btn.textContent = '⏳ يضيف...'; status.textContent = '';
    try {
      await firebase.firestore().collection('ownerNotes').doc(noteDriver.id).set({
        driverId: noteDriver.id,
        driverName: noteDriver.name || noteDriver.id,
        entries: firebase.firestore.FieldValue.arrayUnion(entry),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: entry.by
      }, { merge: true });
      txt.value = '';
      status.innerHTML = '<span style="color:#3fb950;">✅ انضافت الملاحظة</span>';
      setTimeout(() => { status.textContent = ''; }, 3000);
      if (gModalDriver && gModalDriver.id === noteDriver.id) loadOwnerNotes(noteDriver.id);
    } catch(e) {
      console.error('addOwnerNote err:', e);
      status.innerHTML = '<span style="color:#f85149;">❌ فشل الحفظ: ' + escapeHtml(e.message||e) + '</span>';
    } finally {
      btn.disabled = false; btn.textContent = '➕ إضافة ملاحظة';
    }
  }

  function switchMTab(name) {
    const tabs = ['overview','debt','payments','tx'];
    document.querySelectorAll('.mtab-btn').forEach((b,i) => b.classList.toggle('active', tabs[i] === name));
    document.querySelectorAll('.mtab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('mtab-' + name).classList.add('active');
    if (name === 'debt') renderDebtTrendChart();
    else if (name === 'payments') renderPaymentsChart();
  }

  function changeDebtRange(days) {
    gDebtRangeDays = days;
    document.querySelectorAll('.range-pill').forEach(p => p.classList.toggle('active', +p.dataset.range === days));
    renderDebtTrendChart();
  }

  function renderDebtTrendChart() {
    if (!gModalDriver || typeof Chart === 'undefined') return;
    const canvas = document.getElementById('debtTrendChart');
    if (!canvas) return;
    // تنظيف chart قديم
    gModalCharts = gModalCharts.filter(c => { if (c.canvas === canvas) { c.destroy(); return false; } return true; });

    const series = getDebtSeries(gModalDriver, gDebtRangeDays);
    const labels = series.map(p => p.date.toLocaleDateString('ar-KW', {day:'numeric', month:'short'}));
    const debtData = series.map(p => +p.debt.toFixed(3));
    const thr = getDebtThreshold(gModalDriver);
    const thrLine = series.map(() => +thr.toFixed(3));

    // نقاط الدفعات داخل النطاق
    const startDate = new Date(Date.now() - gDebtRangeDays * 86400000);
    const drvPays = gPayments.filter(p => p.driverId===gModalDriver.id && RENT_TYPES.includes(p.type) &&
                                          toDate(p.date) && toDate(p.date) >= startDate);
    // نضع كل دفعة عند أقرب نقطة في series
    const payPoints = drvPays.map(p => {
      const d = toDate(p.date);
      let bestIdx = 0, bestDiff = Infinity;
      series.forEach((pt, i) => { const diff = Math.abs(pt.date - d); if (diff < bestDiff) { bestDiff = diff; bestIdx = i; } });
      return { x: bestIdx, y: series[bestIdx].debt, amount: parseFloat(p.amount||0), date: d };
    });

    const ch = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'إجمالي الدين (د.ك)',
            data: debtData,
            borderColor: '#fb8500', backgroundColor: 'rgba(251,133,0,0.15)',
            fill: true, tension: 0.25, borderWidth: 2, pointRadius: 0
          },
          {
            label: 'عتبة الخطر',
            data: thrLine,
            borderColor: '#f85149', borderDash: [6,4], borderWidth: 1.5,
            pointRadius: 0, fill: false
          },
          {
            label: 'دفعات', type: 'scatter',
            data: payPoints.map(p => ({ x: labels[p.x], y: p.y })),
            backgroundColor: '#58a6ff', borderColor: '#58a6ff',
            pointRadius: 5, pointHoverRadius: 7, showLine: false
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#c9d1d9', font: { family: 'inherit' } } },
          tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + (+ctx.parsed.y).toFixed(3) + ' د.ك' } }
        },
        scales: {
          x: { ticks: { color: '#8b949e', maxTicksLimit: 10 }, grid: { color: '#21262d' } },
          y: { ticks: { color: '#8b949e', callback: v => (+v).toFixed(0) }, grid: { color: '#21262d' }, beginAtZero: true }
        }
      }
    });
    gModalCharts.push(ch);

    // ملخص نصي تحت الـ chart
    const first = series[0].debt, last = series[series.length-1].debt;
    const diff = last - first;
    const sign = diff > 0 ? '▲ زاد' : (diff < 0 ? '▼ نقص' : '⏸ ثبت');
    const color = diff > 0 ? '#f85149' : (diff < 0 ? '#3fb950' : '#8b949e');
    document.getElementById('debtTrendSummary').innerHTML = `
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;">
        <span>دين قبل ${gDebtRangeDays} يوم: <b>${fmtKD(first)}</b></span>
        <span>اليوم: <b>${fmtKD(last)}</b></span>
        <span style="color:${color};font-weight:700;">${sign} ${fmtKD(Math.abs(diff))}</span>
        <span>عدد الدفعات في الفترة: <b>${drvPays.length}</b></span>
      </div>`;
  }

  function renderPaymentsChart() {
    if (!gModalDriver || typeof Chart === 'undefined') return;
    const canvas = document.getElementById('paymentsChart');
    if (!canvas) return;
    gModalCharts = gModalCharts.filter(c => { if (c.canvas === canvas) { c.destroy(); return false; } return true; });

    const buckets = getPaymentBuckets(gModalDriver, 12);
    const labels = buckets.map(b => b.label);
    const rentData = buckets.map(b => +b.rent.toFixed(3));
    const otherData = buckets.map(b => +b.other.toFixed(3));
    const expectedLine = buckets.map(b => +b.expected.toFixed(3));

    const ch = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'الأجرة', data: rentData, stack: 'pay',
            backgroundColor: buckets.map(b => b.paid >= b.expected*0.9 ? '#3fb950' : (b.paid > 0 ? '#d29922' : '#f85149')),
            borderRadius: 3
          },
          {
            label: 'بنود أخرى', data: otherData, stack: 'pay',
            backgroundColor: '#58a6ff', borderRadius: 3
          },
          {
            label: 'المتوقع', type: 'line', data: expectedLine, stack: 'exp',
            borderColor: '#fb8500', borderWidth: 2, borderDash: [4,4],
            pointRadius: 3, pointBackgroundColor: '#fb8500', fill: false, tension: 0
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#c9d1d9', font: { family: 'inherit' } } },
          tooltip: { callbacks: {
            label: (ctx) => ctx.dataset.label + ': ' + (+ctx.parsed.y).toFixed(3) + ' د.ك',
            footer: (items) => {
              const b = buckets[items[0].dataIndex];
              const diff = b.expected - b.paid;
              return 'المجموع: ' + b.paid.toFixed(3) + ' / المتوقع: ' + b.expected.toFixed(3) + ' د.ك'
                   + (diff <= 0.001 ? '  ✅ مكتمل' : '  ⚠️ ناقص ' + diff.toFixed(3));
            }
          } }
        },
        scales: {
          x: { stacked: true, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
          y: { stacked: true, ticks: { color: '#8b949e' }, grid: { color: '#21262d' }, beginAtZero: true }
        }
      }
    });
    gModalCharts.push(ch);
  }

  function renderTxFilters() {
    const wrap = document.getElementById('txFilters');
    if (!wrap || !gModalDriver) return;
    const txs = getAllTransactions(gModalDriver.id);
    const payTypes = {};
    let expCount = 0, revCount = 0;
    txs.forEach(t => {
      if (t.cat === 'expense') expCount++;
      else if (t.cat === 'revenue') revCount++;
      else payTypes[t.type || 'دفعة'] = (payTypes[t.type || 'دفعة'] || 0) + 1;
    });
    const btns = [{ key:'all', label:'الكل', count: txs.length }];
    Object.keys(payTypes).sort((a,b) => payTypes[b] - payTypes[a])
      .forEach(t => btns.push({ key: t, label: t, count: payTypes[t] }));
    if (expCount) btns.push({ key:'expense', label:'مصروفات', count: expCount });
    if (revCount) btns.push({ key:'revenue', label:'إيرادات', count: revCount });
    wrap.innerHTML = btns.map(b =>
      '<button class="tx-filter' + (gTxFilter === b.key ? ' active' : '') + '"'
      + ' data-filter="' + escapeHtml(b.key) + '"'
      + ' onclick="filterTx(this.getAttribute(\'data-filter\'))">'
      + escapeHtml(b.label) + ' (' + b.count + ')</button>'
    ).join('');
  }

  function filterTx(filter) {
    gTxFilter = filter;
    document.querySelectorAll('#txFilters .tx-filter').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-filter') === filter);
    });
    renderTxTable();
  }

  function renderTxTable() {
    if (!gModalDriver) return;
    const wrap = document.getElementById('txTableWrap');
    if (!wrap) return;
    let txs = getAllTransactions(gModalDriver.id);
    if (gTxFilter !== 'all') {
      if (gTxFilter === 'expense') txs = txs.filter(t => t.cat === 'expense');
      else if (gTxFilter === 'revenue') txs = txs.filter(t => t.cat === 'revenue');
      else txs = txs.filter(t => t.cat === 'payment' && t.type === gTxFilter);
    }
    const total = txs.reduce((s,t) => s + t.amount, 0);
    wrap.innerHTML = `
      <p class="small-muted" style="margin-bottom:8px;">عدد المعاملات: <b>${txs.length}</b> · المجموع: <b style="color:${total>=0?'#3fb950':'#f85149'};">${fmtKD(total)}</b></p>
      <div class="table-wrap" style="max-height:420px;">
        <table>
          <thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الوصف</th><th>المرجع</th></tr></thead>
          <tbody>${
            txs.length === 0 ? '<tr><td colspan="5" style="color:#8b949e;padding:20px;">لا توجد معاملات</td></tr>' :
            txs.map(t => `
              <tr>
                <td>${fmtDate(t.date)}</td>
                <td>${t.type}</td>
                <td style="color:${t.amount>=0?'#3fb950':'#f85149'};font-weight:600;">${fmtKD(Math.abs(t.amount))}${t.amount<0?' −':''}</td>
                <td style="text-align:right;">${t.desc||'—'}</td>
                <td><span class="small-muted">${t.ref||'—'}</span></td>

  function engineRentDue(periods,start,end){
    return (periods||[]).reduce((sum,p)=>{
      const anchor=toDate(p.start);
      const periodEnd=toDate(p.end);
      const a=anchor&&anchor>start?anchor:start,b=periodEnd&&periodEnd<end?periodEnd:end;
      if(!a||!b)return sum;
      if(p.contractType==='monthly'){
        if(!anchor||b<a)return sum;
        const throughEnd=_completedMonthsAnchored(anchor,b);
        const throughStart=_completedMonthsAnchored(anchor,a);
        const startAnniversary=throughStart>0?_addMonthsClamped(anchor,throughStart):null;
        const beforeStart=throughStart-(startAnniversary&&startAnniversary>=a?1:0);
        return sum+Math.max(0,throughEnd-beforeStart)*Number(p.rate||0);
      }
      if(b<=a)return sum;
      return sum+Math.max(0,Math.floor((b-a)/86400000))*Number(p.rate||0);
    },0);
  }

     gPayments.filter(p=>p.driverId===d.id&&String(p.status||'').toLowerCase()!=='voided').forEach(p=>{const dt=toDate(p.date);if(!dt||dt<start||dt>end)return;const b=map[bucketKey(dt)];if(!b)return;ownerPaymentParts(p).forEach(a=>{const v=Number(a.amount||0),c=ownerPartClass(p,a);if(c==='rent')b.rentPaid+=v;if(c==='violationIn')b.violationsCollected+=v;if(c==='violationOut')b.violationsCharged+=v;if(c==='old')b.oldPayment+=v;if(c==='residencyOut')b.residencyCharged+=v;if(c==='residencyIn')b.residencyCollected+=v;if(c==='advanceOut')b.advancesGiven+=v;if(c==='advanceIn')b.advancesCollected+=v;});});

    let endpoint=detail.totalDebt; for(let i=arr.length-1;i>=0;i--){arr[i].totalDebt=endpoint;endpoint-=delta(arr[i]);}
